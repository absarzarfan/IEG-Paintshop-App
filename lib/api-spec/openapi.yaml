openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Internal username/password authentication
  - name: users
    description: Current user and user/role management
  - name: brands
    description: Paint brand master data
  - name: materials
    description: Paint material master data and price history
  - name: stock
    description: Warehouse stock balances and movement tracing
  - name: colors
    description: Paint color master data
  - name: job-items
    description: Job/item catalog master data (paint targets)
  - name: serial-numbers
    description: Serial numbers belonging to a job item
  - name: paint-usage
    description: Actual paint usage and server-calculated variance
  - name: audit-log
    description: Append-only audit trail
  - name: dashboard
    description: Summary/overview data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Check whether the initial Admin setup is required
      responses:
        "200":
          description: Authentication setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"

  /auth/setup:
    post:
      operationId: setupAdmin
      tags: [auth]
      summary: Create the first Admin account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetupInput"
      responses:
        "201":
          description: Initial Admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid setup data
        "409":
          description: Admin setup has already been completed

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with an Admin-provided username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid username or password

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current username/password session
      responses:
        "204":
          description: Session ended

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get the current authenticated user
      description: Returns the app user record for the signed-in internal username/password session.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create an application user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Username already exists

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user's role or active status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin only, except self or last active admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: User cannot be deleted
        "404":
          description: Not found

  /brands:
    get:
      operationId: listBrands
      tags: [brands]
      summary: List paint brands
      responses:
        "200":
          description: List of brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
    post:
      operationId: createBrand
      tags: [brands]
      summary: Create a paint brand (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "201":
          description: Created brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"

  /brands/{id}:
    patch:
      operationId: updateBrand
      tags: [brands]
      summary: Update a paint brand (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandUpdate"
      responses:
        "200":
          description: Updated brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "404":
          description: Not found
    delete:
      operationId: deleteBrand
      tags: [brands]
      summary: Delete a paint brand when no materials reference it (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Brand is still referenced by materials

  /colors:
    get:
      operationId: listColors
      tags: [colors]
      summary: List paint colors
      responses:
        "200":
          description: List of colors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Color"
    post:
      operationId: createColor
      tags: [colors]
      summary: Create a paint color (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColorInput"
      responses:
        "201":
          description: Created color
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Color"

  /colors/{id}:
    patch:
      operationId: updateColor
      tags: [colors]
      summary: Update a paint color (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColorUpdate"
      responses:
        "200":
          description: Updated color
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Color"
        "404":
          description: Not found
    delete:
      operationId: deleteColor
      tags: [colors]
      summary: Delete a paint color (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /materials:
    get:
      operationId: listMaterials
      tags: [materials]
      summary: List paint materials
      responses:
        "200":
          description: List of materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
    post:
      operationId: createMaterial
      tags: [materials]
      summary: Create a paint material (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialInput"
      responses:
        "201":
          description: Created material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"

  /materials/{id}:
    get:
      operationId: getMaterial
      tags: [materials]
      summary: Get a paint material by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "404":
          description: Not found
    patch:
      operationId: updateMaterial
      tags: [materials]
      summary: Update a paint material (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialUpdate"
      responses:
        "200":
          description: Updated material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "404":
          description: Not found
    delete:
      operationId: deleteMaterial
      tags: [materials]
      summary: Delete a material when it has no prices, stock, or job references (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Material is still referenced by operational records

  /materials/{id}/prices:
    get:
      operationId: listMaterialPrices
      tags: [materials]
      summary: List price history for a material, newest first
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaterialPrice"
    post:
      operationId: createMaterialPrice
      tags: [materials]
      summary: Record a new price for a material (admin only). Price history is append-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialPriceInput"
      responses:
        "201":
          description: Created price entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialPrice"

  /stock:
    get:
      operationId: listStockSummary
      tags: [stock]
      summary: List current stock balances by material
      responses:
        "200":
          description: Current stock balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockSummary"

  /stock/movements:
    get:
      operationId: listStockMovements
      tags: [stock]
      summary: List stock movements, newest first
      responses:
        "200":
          description: Stock movement history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovement"
    post:
      operationId: createStockMovement
      tags: [stock]
      summary: Record a stock receipt, issue, or adjustment (admin or warehouse)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockMovementInput"
      responses:
        "201":
          description: Created stock movement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"
        "400":
          description: Invalid stock movement

  /job-items:
    get:
      operationId: listJobItems
      tags: [job-items]
      summary: List job/item catalog entries
      parameters:
        - name: search
          in: query
          required: false
          description: Case-insensitive search over job number and description
          schema:
            type: string
      responses:
        "200":
          description: List of job items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobItem"
    post:
      operationId: createJobItem
      tags: [job-items]
      summary: Create a job/item catalog entry (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobItemInput"
      responses:
        "201":
          description: Created job item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobItem"

  /job-items/{id}:
    get:
      operationId: getJobItem
      tags: [job-items]
      summary: Get a job/item catalog entry with derived cost preview
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job item detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobItemDetail"
        "404":
          description: Not found
    patch:
      operationId: updateJobItem
      tags: [job-items]
      summary: Update a job/item catalog entry (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobItemUpdate"
      responses:
        "200":
          description: Updated job item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobItem"
        "404":
          description: Not found
    delete:
      operationId: deleteJobItem
      tags: [job-items]
      summary: Delete a job item with no serial or usage records (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Job item is still referenced by serials or usage records

  /job-items/{jobItemId}/serial-numbers:
    get:
      operationId: listJobItemSerialNumbers
      tags: [serial-numbers]
      summary: List serial numbers registered under a job item
      parameters:
        - name: jobItemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of serial numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SerialNumber"
    post:
      operationId: createJobItemSerialNumbers
      tags: [serial-numbers]
      summary: Register serial numbers under a job item, as an explicit list or a numeric range (admin only)
      parameters:
        - name: jobItemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SerialNumberBulkInput"
      responses:
        "201":
          description: Created serial numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SerialNumber"

  /serial-numbers/{id}:
    delete:
      operationId: deleteSerialNumber
      tags: [serial-numbers]
      summary: Remove a serial number (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /paint-usage:
    get:
      operationId: listPaintUsage
      tags: [paint-usage]
      summary: List paint usage records with calculated variance
      parameters:
        - name: jobItemId
          in: query
          required: false
          schema: { type: integer }
        - name: serialNumberId
          in: query
          required: false
          schema: { type: integer }
        - name: fromDate
          in: query
          required: false
          schema: { type: string, format: date }
        - name: toDate
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Paint usage records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaintUsage"
    post:
      operationId: createPaintUsage
      tags: [paint-usage]
      summary: Record actual paint usage for a serial number (admin or painter)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaintUsageInput"
      responses:
        "201":
          description: Created paint usage record with variance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaintUsage"
        "400":
          description: Invalid input or serial number does not belong to the job item
        "409":
          description: A usage record already exists for this serial number

  /paint-usage/{id}:
    get:
      operationId: getPaintUsage
      tags: [paint-usage]
      summary: Get one paint usage record with calculated variance
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Paint usage record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaintUsage"
        "404":
          description: Not found
    patch:
      operationId: updatePaintUsage
      tags: [paint-usage]
      summary: Update actual paint usage (admin or painter)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaintUsageUpdate"
      responses:
        "200":
          description: Updated paint usage record with variance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaintUsage"
        "404":
          description: Not found

  /audit-log:
    get:
      operationId: listAuditLog
      tags: [audit-log]
      summary: List audit trail entries, newest first (admin only)
      parameters:
        - name: entityType
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Overview counts and recent audit activity for the home screen
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserRole:
      type: string
      enum: [admin, painter, warehouse]
      description: Application roles managed by an Admin

    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        name: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        role:
          $ref: "#/components/schemas/UserRole"
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, username, name, email, role, isActive, createdAt]

    AuthStatus:
      type: object
      properties:
        setupRequired: { type: boolean }
      required: [setupRequired]

    AuthSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]

    LoginInput:
      type: object
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 4, maxLength: 128, format: password }
      required: [username, password]

    AdminSetupInput:
      type: object
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 4, maxLength: 128, format: password }
        name: { type: string, minLength: 1, maxLength: 120 }
      required: [username, password, name]

    UserInput:
      type: object
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 4, maxLength: 128, format: password }
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: ["string", "null"] }
        role:
          $ref: "#/components/schemas/UserRole"
        isActive: { type: boolean }
      required: [username, password, name, role]

    UserUpdate:
      type: object
      properties:
        password: { type: string, minLength: 4, maxLength: 128, format: password }
        role:
          $ref: "#/components/schemas/UserRole"
        isActive: { type: boolean }

    Brand:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, name, isActive, createdAt]

    BrandInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
      required: [name]

    BrandUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        isActive: { type: boolean }

    Color:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        hexCode: { type: ["string", "null"] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, name, hexCode, isActive, createdAt]

    ColorInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        hexCode: { type: string }
      required: [name]

    ColorUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        hexCode: { type: ["string", "null"] }
        isActive: { type: boolean }

    MaterialType:
      type: string
      enum: [Primer, Topcoat, Hardener, Thinner, Activator]

    Material:
      type: object
      properties:
        id: { type: integer }
        brandId: { type: integer }
        brandName: { type: string }
        description: { type: string }
        type:
          $ref: "#/components/schemas/MaterialType"
        packagingSizeL: { type: number }
        color: { type: ["string", "null"] }
        deadStockThreshold: { type: number }
        currency: { type: string }
        currentUnitPrice: { type: ["number", "null"] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
      required:
        [
          id,
          brandId,
          brandName,
          description,
          type,
          packagingSizeL,
          color,
          deadStockThreshold,
          currency,
          currentUnitPrice,
          isActive,
          createdAt,
        ]

    MaterialInput:
      type: object
      properties:
        brandId: { type: integer }
        description: { type: string, minLength: 1 }
        type:
          $ref: "#/components/schemas/MaterialType"
        packagingSizeL: { type: number, minimum: 0 }
        color: { type: string }
        deadStockThreshold: { type: number, minimum: 0 }
        currency: { type: string, minLength: 1 }
      required:
        [brandId, description, type, packagingSizeL, deadStockThreshold, currency]

    MaterialUpdate:
      type: object
      properties:
        brandId: { type: integer }
        description: { type: string, minLength: 1 }
        type:
          $ref: "#/components/schemas/MaterialType"
        packagingSizeL: { type: number, minimum: 0 }
        color: { type: ["string", "null"] }
        deadStockThreshold: { type: number, minimum: 0 }
        currency: { type: string, minLength: 1 }
        isActive: { type: boolean }

    MaterialPrice:
      type: object
      properties:
        id: { type: integer }
        materialId: { type: integer }
        unitPrice: { type: number }
        currency: { type: string }
        effectiveDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
      required: [id, materialId, unitPrice, currency, effectiveDate, createdAt]

    MaterialPriceInput:
      type: object
      properties:
        unitPrice: { type: number, minimum: 0 }
        currency: { type: string, minLength: 1 }
        effectiveDate: { type: string, format: date }
      required: [unitPrice, currency, effectiveDate]

    StockMovementType:
      type: string
      enum: [in, out, adjustment]

    StockSummary:
      type: object
      properties:
        materialId: { type: integer }
        materialDescription: { type: string }
        brandName: { type: string }
        packagingSizeL: { type: number }
        deadStockThreshold: { type: number }
